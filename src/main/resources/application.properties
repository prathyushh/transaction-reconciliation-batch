spring.application.name=transaction-reconciliation-batch

spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_reconciliation_db
spring.datasource.username=postgres
spring.datasource.password=Cred.ai

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

app.input.csv1-path=C:/TransactionReconciliation/input/csv1.csv
app.input.csv2-path=C:/TransactionReconciliation/input/csv2.csv

app.output.result-csv-path=C:/TransactionReconciliation/output/reconciliation_result.csv

app.csv.expected-headers=transaction_id,account_number,transaction_date,amount,currency,transaction_type,description

app.batch.run=true
app.batch.run-id=10020

app.csv.max-file-size=10485760

app.batch.chunk-size=100
app.batch.processor.core-pool-size=4
app.batch.processor.max-pool-size=4
app.batch.processor.queue-capacity=100